<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/favicon.ico}" />
    <title>Erro no Sistema</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            line-height: 1.6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--gray-700);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .error-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 40px 30px 30px;
            position: relative;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .error-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .error-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .error-content {
            padding: 30px;
        }

        .error-details {
            background: var(--gray-50);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border-left: 4px solid var(--error-color);
        }

        .error-details h3 {
            font-size: 1.1rem;
            color: var(--gray-800);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-details h3 i {
            color: var(--error-color);
        }

        .error-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .error-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-200);
        }

        .error-item:last-child {
            border-bottom: none;
        }

        .error-label {
            font-weight: 500;
            color: var(--gray-600);
        }

        .error-value {
            font-weight: 600;
            color: var(--gray-800);
        }

        .error-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
            transform: translateY(-2px);
        }

        .error-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .contact-support {
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .contact-support a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-support a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .error-container {
                max-width: 100%;
            }

            .error-header {
                padding: 30px 20px 20px;
            }

            .error-header h1 {
                font-size: 2rem;
            }

            .error-content {
                padding: 20px;
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-container {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-header">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 th:text="#{error.title}">Solicitação não processada</h1>
        <p th:text="#{error.subtitle}">Desculpe, ocorreu um erro inesperado.</p>
    </div>

    <div class="error-content">
        <div class="error-details">
            <h3><i class="fas fa-info-circle"></i> Detalhes do Erro</h3>
            <div class="error-info">
                <div class="error-item">
                    <span class="error-label">Status:</span>
                    <span class="error-value" th:text="${error}">Erro</span>
                </div>
                <div class="error-item" th:if="${!#strings.isEmpty(message)}">
                    <span class="error-label">Mensagem:</span>
                    <span class="error-value" th:text="${message}">Mensagem de erro</span>
                </div>
                <div class="error-item">
                    <span class="error-label">Timestamp:</span>
                    <span class="error-value" th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">
                            Data e hora
                        </span>
                </div>
            </div>
        </div>

        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Página Inicial
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
        </div>

        <div class="error-footer">
            <p>Se o problema persistir, entre em contato com o suporte técnico.</p>
            <div class="contact-support">
                <a href="mailto:support@example.com">
                    <i class="fas fa-envelope"></i> support@example.com
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // Adiciona um efeito de digitação ao título
    document.addEventListener('DOMContentLoaded', function() {
        const errorIcon = document.querySelector('.error-icon');
        errorIcon.style.animation = 'bounce 1s ease-in-out';

        // Adiciona classe de loaded para animações
        setTimeout(() => {
            document.body.classList.add('loaded');
        }, 100);
    });
</script>
</body>
</html>
