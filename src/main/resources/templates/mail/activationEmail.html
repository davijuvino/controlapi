<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">

<head>
    <title th:text="#{email.activation.title}">JHipster activation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" th:href="@{|${baseUrl}/favicon.ico|}" />
    <style>
        body {
            font-family: "Arial", sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #4caf50;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .button-primary {
            background-color: #4caf50;
        }
        .button-primary:hover {
            background-color: #0056b3;
        }
        .activation-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .button-container {
            margin: 20px 0;
        }
    </style>
</head>

<body>
<div class="header">
    <h1 th:text="#{email.activation.title}">Sistema de Controle Financeiro</h1>
</div>
<div class="content">
    <p>Olá, <strong th:text="#{email.activation.greeting(${user.login})}">Usuário</strong>!</p>
    <p th:text="#{email.activation.text1}">Esta é uma mensagem de ativação.</p>
    <p th:if="${dataEvento}">Data do evento: <span th:text="${#temporals.format(dataEvento, 'dd/MM/yyyy HH:mm')}"></span></p>

    <div class="button-container">
        <a th:href="@{|${baseUrl}/api/ativar?chave=${user.activationKey}|}" class="button button-primary">
            Ativar Conta
        </a>
    </div>
    <div>
        <p>
            <span th:text="#{email.activation.text2}">Regards, </span>
            <br />
            <em th:text="#{email.signature}">JHipster.</em>
        </p>
    </div>
</div>
<div class="footer">
    <p>Este é um e-mail automático, por favor não responda.</p>
    <p th:text="'Enviado em: ' + ${#temporals.format(dataEvento, 'dd/MM/yyyy HH:mm')}"></p>
</div>
</body>
</html>
